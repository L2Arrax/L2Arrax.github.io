<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2Arrax - Grand Opening</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster {
            width: 800px;
            height: 800px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background pattern */
        .poster::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(212, 165, 116, 0.015) 2px, rgba(212, 165, 116, 0.015) 4px);
            pointer-events: none;
            z-index: 1;
        }

        /* Glow effect */
        .logo-glow {
            position: absolute;
            top: 160px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.12) 0%, transparent 70%);
            filter: blur(50px);
            animation: pulse 4s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.5; }
        }

        /* Logo */
        .logo-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .logo-container img {
            width: 280px;
            height: auto;
            filter: drop-shadow(0 8px 24px rgba(212, 165, 116, 0.4));
        }

        /* Divider */
        .divider {
            position: absolute;
            top: 310px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4a574 20%, #d4a574 80%, transparent);
            opacity: 0.25;
            z-index: 3;
        }

        /* Opening section */
        .opening-section {
            position: absolute;
            top: 340px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .grand-opening {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #d4a574;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(212, 165, 116, 0.4);
        }

        .date-time {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, #d4a574 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Cinzel', serif;
        }

        /* Highlights */
        .highlights {
            position: absolute;
            top: 450px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .highlight-badge {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1), rgba(212, 165, 116, 0.05));
            border: 1px solid rgba(212, 165, 116, 0.25);
            color: #d4a574;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Features grid */
        .features {
            position: absolute;
            top: 500px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 700px;
            z-index: 10;
        }

        .feature-item {
            text-align: center;
            padding: 14px 8px;
            border: 1px solid rgba(212, 165, 116, 0.15);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }

        .feature-title {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: #d4a574;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .feature-value {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Bottom info */
        .bottom-info {
            position: absolute;
            bottom: 55px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            z-index: 10;
        }

        .website {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: #d4a574;
            letter-spacing: 1.5px;
            text-decoration: none;
            padding: 6px 16px;
            border: 1px solid rgba(212, 165, 116, 0.25);
            display: inline-block;
        }

        /* Corner decorations */
        .corner-decor {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1px solid rgba(212, 165, 116, 0.2);
            z-index: 5;
        }

        .corner-decor.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decor.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-decor.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-decor.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
